name: FortuneOS Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'FortuneOS.zip'
      - '.github/workflows/fortuneos-android-build.yml'

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and extract uploaded project
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q FortuneOS.zip -d extracted
          echo "=== ZIP CONTENTS ==="
          unzip -l FortuneOS.zip
          ROOT="$(dirname "$(find extracted -type f -name settings.gradle.kts -print -quit)")"
          if [ -z "${ROOT:-}" ] || [ "$ROOT" = "." ]; then
            echo "Could not locate settings.gradle.kts in FortuneOS.zip." | tee build-diagnosis.txt
            exit 2
          fi
          echo "Project root: $ROOT" | tee build-diagnosis.txt
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "=== Root build.gradle.kts ==="
          cat "$ROOT/build.gradle.kts" || true
          echo "=== App build.gradle.kts ==="
          cat "$ROOT/app/build.gradle.kts" || true
          echo "=== settings.gradle.kts ==="
          cat "$ROOT/settings.gradle.kts" || true
          AGP_VERSION="$(grep 'com.android.application' "$ROOT/build.gradle.kts" "$ROOT/settings.gradle.kts" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)"
          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION="$(grep -R 'com.android.application' "$ROOT" --include='*.gradle.kts' --include='*.gradle' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)"
          fi
          if [ -z "$AGP_VERSION" ]; then
            GRADLE_VERSION="8.13"
            echo "Could not automatically detect Android Gradle Plugin version; trying Gradle $GRADLE_VERSION."
          else
            AGP_MAJOR="${AGP_VERSION%%.*}"
            if [ "$AGP_MAJOR" -ge 9 ]; then
              GRADLE_VERSION="9.1.0"
            else
              GRADLE_VERSION="8.13"
            fi
            echo "Detected Android Gradle Plugin $AGP_VERSION; selected Gradle $GRADLE_VERSION."
          fi
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
            echo "Gradle wrapper found." | tee -a build-diagnosis.txt
          else
            echo "No Gradle wrapper found; using installed Gradle." | tee -a build-diagnosis.txt
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.inspect.outputs.gradle_version }}

      - name: Build debug APK
        shell: bash
        run: |
          set -uo pipefail
          ROOT="${{ steps.inspect.outputs.project_root }}"
          cd "$ROOT"
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Collect APKs and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p output
          find extracted -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} output/ \; 2>/dev/null || true
          find extracted -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' -o -name 'AndroidManifest.xml' \) -print | sort > output/project-files.txt
          [ ! -f build.log ] || cp build.log output/
          [ ! -f build-diagnosis.txt ] || cp build-diagnosis.txt output/
          echo "Collected files:"
          find output -maxdepth 2 -type f -printf '%p (%s bytes)\n'

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FortuneOS-build-results
          path: |
            output/**
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

name: Extract FortuneOS ZIP for review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safely extract project archive
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, stat, sys
          archive = pathlib.Path("FortuneOS.zip")
          out = pathlib.Path("extracted-project")
          if not archive.is_file():
              sys.exit("FortuneOS.zip was not found.")
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if len(entries) > 5000:
                  sys.exit("Archive contains more than 5000 entries; stopping for safety.")
              total = sum(i.file_size for i in entries)
              if total > 100 * 1024 * 1024:
                  sys.exit("Uncompressed archive exceeds 100 MB; stopping for safety.")
              for item in entries:
                  p = pathlib.PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if p.is_absolute() or ".." in p.parts or (mode and stat.S_ISLNK(mode)):
                      sys.exit("Unsafe path or symbolic link found in ZIP; extraction stopped.")
              out.mkdir(exist_ok=True)
              z.extractall(out)
          print("Extracted archive contents into extracted-project/ without running project code.")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-project
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract FortuneOS source archive for review"
          git push
